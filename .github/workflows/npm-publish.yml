name: npm publish

# Publishes the five npm packages of an existing GitHub Release with npm
# trusted publishing (OIDC), so no npm token is stored anywhere. The packages
# are rendered by tools/release from the release's own archives, after their
# SHA256SUMS check, so the executables on npm are the released ones.
#
# Each package on npmjs.com must name this repository and the workflow file
# npm-publish.yml as a trusted publisher that may run "npm publish". Run this
# by hand after the GitHub Release is published, then run "npm smoke test".
# A version already on the registry is skipped, so rerunning after a partial
# failure publishes only what is missing. dry_run runs every step with
# "npm publish --dry-run" and publishes nothing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 1.0.3
        required: true
        type: string
      dry_run:
        description: Run every step with npm publish --dry-run and publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    # Release archives are built on an Apple silicon Mac, which records that
    # it ran only the darwin/arm64 executable. tools/release packaging checks
    # the executable of its own host against that record, so this job runs on
    # an Apple silicon runner.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Lets npm exchange a GitHub OIDC token for a short-lived publish token.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the inputs
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must look like 1.2.3, without a v prefix: $VERSION" >&2
            exit 1
          fi
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "a real publish runs only from main; this run uses $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - name: Check the source version
        run: |
          declared="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)"
          if [ "$declared" != "$VERSION" ]; then
            echo "tag v$VERSION declares version '$declared'" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # No registry-url: setup-node would write an _authToken line that stays
      # empty without NODE_AUTH_TOKEN and keeps npm from using OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check Node and npm
        run: |
          # Trusted publishing needs Node 22.14.0 and npm 11.5.1 or newer.
          at_least() {
            if [ "$(printf '%s\n%s\n' "$3" "$2" | sort -V | head -n 1)" != "$3" ]; then
              echo "$1 $2 is older than $3" >&2
              exit 1
            fi
          }
          at_least Node "$(node --version | sed 's/^v//')" 22.14.0
          at_least npm "$(npm --version)" 11.5.1
          echo "Node $(node --version), npm $(npm --version)"
          if [ "$(npm config get registry)" != https://registry.npmjs.org/ ]; then
            echo "npm uses the registry $(npm config get registry)" >&2
            exit 1
          fi
          if [[ "$(npm config list)" == *_authToken* ]]; then
            echo "an npm auth token is configured; trusted publishing needs none" >&2
            exit 1
          fi

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --pattern manifest.json
          # Download exactly the archives that SHA256SUMS lists.
          count=0
          while read -r digest name; do
            if ! [[ "$digest" =~ ^[0-9a-f]{64}$ && "$name" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "unexpected SHA256SUMS line" >&2
              exit 1
            fi
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$name"
            count=$((count + 1))
          done < SHA256SUMS
          if [ "$count" -ne 4 ]; then
            echo "SHA256SUMS lists $count archives, not 4" >&2
            exit 1
          fi
          shasum -a 256 --check --strict SHA256SUMS

      - name: Render the npm packages
        run: |
          go run ./tools/release packaging -strict -formats npm \
            -manifest "$RUNNER_TEMP/release/manifest.json" \
            -out "$RUNNER_TEMP/packaging" \
            -base-url "https://github.com/juliankang4/owngit/releases/download/v$VERSION" \
            -homepage https://github.com/juliankang4/owngit \
            -repository-url https://github.com/juliankang4/owngit.git \
            -tap juliankang4/homebrew-tap

      - name: Publish
        run: |
          cd "$RUNNER_TEMP/packaging/npm"
          # Platform packages first and owngit last, so no install sees
          # version pins that do not resolve yet.
          packages=(owngit-darwin-arm64 owngit-linux-x64 owngit-linux-arm64 owngit-win32-x64 owngit)
          for name in "${packages[@]}"; do
            # shellcheck disable=SC2016 # JavaScript, not shell, expands ${...} here.
            node -e '
              const [dir, name, version] = process.argv.slice(1);
              const pkg = require(require("path").resolve(dir, "package.json"));
              if (pkg.name !== name || pkg.version !== version || pkg.private) {
                console.error(`${dir}/package.json is ${pkg.name}@${pkg.version}, private=${pkg.private}`);
                process.exit(1);
              }' "$name" "$name" "$VERSION"
          done
          # published NAME succeeds when NAME@VERSION is on the registry and
          # fails when it is not; any other lookup error ends the job.
          published() {
            local output code found
            if output="$(npm view "$1@$VERSION" version --json 2>/dev/null)"; then
              # npm 11 prints "1.2.3" and npm 12 prints ["1.2.3"].
              found="$(node -p '
                const [text, version] = process.argv.slice(1);
                let value = null;
                try { value = JSON.parse(text) } catch {}
                if (Array.isArray(value) && value.length === 1) value = value[0];
                value === version' "$output" "$VERSION")"
              [ "$found" = true ] && return 0
              echo "unexpected registry answer for $1@$VERSION: $output" >&2
              exit 1
            fi
            code="$(node -p 'try { JSON.parse(process.argv[1]).error.code } catch { "" }' "$output")"
            [ "$code" = E404 ] && return 1
            echo "could not look up $1@$VERSION on the registry: $output" >&2
            exit 1
          }
          # dry_publish NAME [FLAG] runs the dry run and warns when npm got no
          # publish token, which means the trusted publisher does not match.
          dry_publish() {
            npm publish "./$1" --ignore-scripts --provenance --dry-run "${@:2}" 2>&1 | tee "$RUNNER_TEMP/dry-run.log"
            if grep -q 'requires you to be logged in' "$RUNNER_TEMP/dry-run.log"; then
              echo "::warning::npm got no publish token for $1 through trusted publishing; check its trusted publisher on npmjs.com"
            fi
          }
          for name in "${packages[@]}"; do
            if published "$name"; then
              if [ "$DRY_RUN" != true ]; then
                echo "$name@$VERSION is already on the registry; skipped"
                continue
              fi
              # --force only lets the dry run pack and authenticate a
              # version that a real run would skip.
              echo "$name@$VERSION is already on the registry; a real run skips it"
              dry_publish "$name" --force
            elif [ "$DRY_RUN" = true ]; then
              dry_publish "$name"
            else
              npm publish "./$name" --ignore-scripts --provenance
              echo "$name@$VERSION published"
            fi
          done
