name: Document links

# Checks every relative link and heading anchor in the repository's Markdown,
# by GitHub's anchor rules, and the links from Go source to documents, with
# tools/doclinks. It runs on every pull request, because renaming or removing
# any file can break a link to it.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-links-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  links:
    name: document links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check links
        run: go run ./tools/doclinks
