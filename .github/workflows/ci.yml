name: CI

# Runs the checks from CONTRIBUTING.md on every pull request. Pull requests
# merge by fast-forward, so main receives the commits that already passed here
# and pushes to main do not run the checks again; run them by hand from the
# Actions tab when needed. Tests run on Linux (with the race detector),
# Windows, and macOS.
#
# The tests of every package are split over four shards per system by
# .github/scripts/test-shard.sh. Each job runs about a quarter of every
# package, so the slowest package no longer sets the length of a run. Each test
# runs in exactly one shard, and new tests join a shard without changes here.
#
# A change to documents alone runs nothing. The documents that tests read or
# that release archives carry still run the checks.

on:
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/images/**"
      - "docs/CODING_TOOLS.md"
      - "docs/CODING_TOOLS.ko.md"
      - "integrations/**"
      - "THIRD_PARTY_NOTICES/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs; a manual run keeps going.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: gofmt and go vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (linux, windows, darwin)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Keep in step with the shard count passed to test-shard.sh below.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Keep LF line endings on Windows so gofmt and byte-exact fixtures match.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Tool versions
        run: |
          go version
          git --version

      # Linux runs the tests once, with the race detector, which also runs
      # every test; test-shard.sh names the packages it leaves out. Windows and
      # macOS run them without it.
      - name: go test (shard ${{ matrix.shard }} of 4)
        run: bash .github/scripts/test-shard.sh ${{ matrix.shard }} 4 ${{ runner.os == 'Linux' && '-race' || '' }}
