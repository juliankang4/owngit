name: CI

# Runs the checks on every pull request. Pull requests
# merge by fast-forward, so main receives the commits that already passed here
# and pushes to main do not run the checks again. Tests run on Linux (with the
# race detector), Windows, and macOS, on fresh runners. Only the test jobs keep
# the Go module and build caches, under a key that hashes go.sum and covers the
# Go version and the runner system, architecture and image;
# actions/setup-go restores the cache that key names and saves a new one only
# when the key changes. gofmt and go vet, package selection and govulncheck
# download what they need. Tests run with -count=1, so no earlier test result
# is reused.
#
# A pull request tests only the packages its change can affect, as chosen by
# .github/scripts/affected-packages.sh: those whose tests contain a changed
# package or read its files. A Markdown file outside every package tests only
# the packages whose tests read it; one under testdata, node_modules or a
# directory whose name starts with a dot, which those tests skip, tests every
# package. Any other change outside every package, such as go.mod or this
# workflow, tests every package. gofmt and go vet always cover every package.
# The packages a change touches directly run in full; a package selected only
# because its tests depend on a changed package, or read a changed file, runs
# with -short, which skips the tests that spend their time on a long real wait,
# such as a transfer deadline, or on long fixture work, such as a full release
# build. A change to a test helper package, whose code other test binaries
# contain, and a change that selects every package run every selected package
# in full.
#
# Full runs test every package: once a day at an off-peak hour, which catches
# tests that fail only now and then, and when started by hand, which a release
# does on its commit (gh workflow run ci.yml --ref vX.Y.Z). Full runs also test
# on Linux arm64 and check for known vulnerabilities; the daily run also
# shuffles the order of the tests in each package.
#
# The tests are split over four shards per system by
# .github/scripts/test-shard.sh. Each job runs about a quarter of every
# selected package, so the slowest package no longer sets the length of a
# run. Each test runs in exactly one shard, and new tests join a shard without
# changes here.
#
# Every pull request runs these checks; which packages they test is chosen
# as described above.
#
# The "CI passed" job waits for every other job and fails unless each one
# passed (govulncheck may be skipped). From this workflow, branch protection
# requires only that job, so the test matrix can change without changing the
# protection.

on:
  pull_request:
  # GitHub runs scheduled workflows on the default branch only.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled, manual and pull request runs each have their own group, so no
  # kind of run cancels or holds back another.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded pull request runs; scheduled and manual runs keep going.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: gofmt and go vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Only the test jobs write the Go caches.
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet (linux, windows, darwin)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: Install golangci-lint
        if: github.event_name == 'pull_request'
        env:
          LINT_VERSION: 2.14.0
          LINT_SHA256: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
        run: |
          archive="golangci-lint-${LINT_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/golangci/golangci-lint/releases/download/v${LINT_VERSION}/$archive"
          printf '%s  %s\n' "$LINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" \
            "golangci-lint-${LINT_VERSION}-linux-amd64/golangci-lint"
          echo "$RUNNER_TEMP/golangci-lint-${LINT_VERSION}-linux-amd64" >>"$GITHUB_PATH"

      - name: Test timing (linux, windows, darwin, new lines only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          status=0
          for goos in linux windows darwin; do
            echo "== GOOS=$goos"
            GOOS=$goos golangci-lint run --new-from-merge-base="origin/$BASE_REF" ./... || status=1
          done
          exit $status

  select:
    name: select packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      fullpackages: ${{ steps.select.outputs.fullpackages }}
      vulncheck: ${{ steps.select.outputs.vulncheck }}
    steps:
      # A pull request's checkout is GitHub's merge of the pull request into
      # its base, so its first parent is the base and the change is the
      # difference between the two.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Only the test jobs write the Go caches.
          cache: false

      - name: Packages to test
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            packages="$(bash .github/scripts/affected-packages.sh HEAD^1 HEAD | tr '\n' ' ')"
            packages="${packages% }"
            fullpackages="$(bash .github/scripts/affected-packages.sh --full HEAD^1 HEAD | tr '\n' ' ')"
            fullpackages="${fullpackages% }"
            vulncheck=false
            if [ -n "$(git diff --name-only HEAD^1 HEAD -- go.mod go.sum)" ]; then
              vulncheck=true
            fi
          else
            packages=./...
            fullpackages=./...
            vulncheck=true
          fi
          echo "Packages to test: ${packages:-none}"
          echo "Packages to test in full: ${fullpackages:-none}"
          {
            echo "packages=$packages"
            echo "fullpackages=$fullpackages"
            echo "vulncheck=$vulncheck"
          } >>"$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/4)
    needs: select
    # Run even when the selection failed, so that the test jobs report a
    # failure instead of being skipped.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # Full runs add Linux arm64.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest", "ubuntu-24.04-arm"]') }}
        # Keep in step with the shard count passed to test-shard.sh below.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Selection succeeded
        env:
          RESULT: ${{ needs.select.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "Selecting the packages to test failed." >&2
            exit 1
          fi

      # Keep LF line endings on Windows so gofmt and byte-exact fixtures match.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The test jobs are the only writers of the Go caches. Their key
          # hashes go.sum, not actions/setup-go's default go.mod, so this cache
          # has an identity of its own.
          cache-dependency-path: go.sum

      - name: Tool versions
        run: |
          go version
          git --version

      # Linux runs the tests with the race detector, which also runs every
      # test; test-shard.sh names the packages it leaves out. Other systems
      # run them without it. The daily run shuffles the order of the tests in
      # each package: a failing package's log starts with "-test.shuffle N",
      # and "go test -shuffle=N" with the same -run pattern repeats the order.
      - name: go test (shard ${{ matrix.shard }} of 4)
        env:
          PACKAGES: ${{ needs.select.outputs.packages }}
          FULLPACKAGES: ${{ needs.select.outputs.fullpackages }}
          EVENT: ${{ github.event_name }}
          FLAGS: ${{ runner.os == 'Linux' && '-race' || '' }} ${{ github.event_name == 'schedule' && '-shuffle=on' || '' }}
        run: |
          read -ra flags <<<"$FLAGS"
          echo "go test flags: ${flags[*]-none}"
          # A pull request runs the packages it changes in full and the rest
          # with -short; a full run tests every package.
          full=()
          if [ "$EVENT" = pull_request ]; then
            full=(--full-packages "$FULLPACKAGES")
          fi
          bash .github/scripts/test-shard.sh --packages "$PACKAGES" ${full[@]+"${full[@]}"} ${{ matrix.shard }} 4 ${flags[@]+"${flags[@]}"}

  vulnerabilities:
    name: govulncheck
    needs: select
    # Pull requests that change go.mod or go.sum, and every full run.
    if: ${{ needs.select.outputs.vulncheck == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Only the test jobs write the Go caches.
          cache: false

      # govulncheck reports only vulnerabilities in code OwnGit calls, in its
      # modules and in the Go standard library, and fails if there is one.
      # What is called differs by system, so each is checked.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          for goos in linux windows darwin; do
            echo "== GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/govulncheck" ./...
          done

  passed:
    name: CI passed
    needs: [lint, select, test, vulnerabilities]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          LINT: ${{ needs.lint.result }}
          SELECT: ${{ needs.select.result }}
          TEST: ${{ needs.test.result }}
          VULNERABILITIES: ${{ needs.vulnerabilities.result }}
        run: |
          echo "lint=$LINT select=$SELECT test=$TEST vulnerabilities=$VULNERABILITIES"
          [ "$LINT" = success ] && [ "$SELECT" = success ] && [ "$TEST" = success ] &&
            { [ "$VULNERABILITIES" = success ] || [ "$VULNERABILITIES" = skipped ]; }
